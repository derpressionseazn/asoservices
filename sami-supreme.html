<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SAMI SUPREME</title>
<style>
  /* ============================================================
     SAMI SUPREME — a lost 16-bit gem
     Self-contained. No external assets. Everything procedural.
     ============================================================ */
  :root{
    --ink:#1a1228; --cream:#f4e9d0; --red:#e5404a; --gold:#f7c948;
    --blue:#3a6ea5; --green:#5fae54; --pink:#e08bb0; --shadow:#0d0a16;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
     -webkit-user-select:none;user-select:none;touch-action:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
     font-family:'Courier New',monospace;color:var(--cream);}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
     background:#000;touch-action:none;}
  /* On-screen touch controls */
  #touch{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;}
  .pad{position:absolute;pointer-events:auto;}
  #stick{left:3%;bottom:5%;width:38vmin;height:38vmin;max-width:200px;max-height:200px;
     border-radius:50%;background:rgba(244,233,208,.10);border:3px solid rgba(244,233,208,.30);}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;
     transform:translate(-50%,-50%);background:rgba(247,201,72,.55);border:2px solid rgba(244,233,208,.7);}
  #btns{right:2%;bottom:4%;width:46vmin;height:46vmin;max-width:260px;max-height:260px;}
  .btn{position:absolute;width:14.5vmin;height:14.5vmin;max-width:84px;max-height:84px;
     border-radius:50%;display:flex;align-items:center;justify-content:center;
     font-weight:bold;font-size:3.6vmin;color:var(--ink);border:3px solid rgba(13,10,22,.5);
     box-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:auto;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4);}
  #bA{right:0;bottom:14vmin;background:var(--red);}        /* light */
  #bB{right:15vmin;bottom:3vmin;background:var(--gold);}   /* heavy */
  #bJ{right:15vmin;bottom:18vmin;background:var(--green);} /* jump */
  #bX{right:0;bottom:29vmin;background:var(--blue);color:var(--cream);} /* special */
  #bD{right:30vmin;bottom:8vmin;background:var(--pink);width:12vmin;height:12vmin;font-size:2.8vmin;} /* dodge */
  #bS{right:30vmin;bottom:22vmin;background:#b07acc;width:12vmin;height:12vmin;font-size:2.6vmin;color:var(--cream);} /* super */
  /* HTML overlay menu buttons (used on title/dialogue/ending for crisp text + a11y) */
  #ui{position:fixed;inset:0;z-index:30;pointer-events:none;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
     justify-content:center;pointer-events:auto;padding:4vmin;text-align:center;}
  .screen.on{display:flex;}
  .choice{pointer-events:auto;background:var(--ink);color:var(--cream);border:3px solid var(--gold);
     padding:14px 18px;margin:6px;font-family:'Courier New',monospace;font-size:clamp(13px,3.4vmin,20px);
     font-weight:bold;cursor:pointer;min-width:240px;max-width:90vw;box-shadow:4px 4px 0 var(--shadow);
     letter-spacing:.5px;}
  .choice:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow);}
  .choice.fight{border-color:var(--red);}
  .choice.talk{border-color:var(--green);}
  #pauseBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:25;display:none;
     pointer-events:auto;background:rgba(13,10,22,.72);color:var(--gold);border:2px solid var(--gold);
     width:38px;height:30px;border-radius:6px;font-size:13px;font-weight:bold;letter-spacing:1px;
     align-items:center;justify-content:center;cursor:pointer;}
  #rotateHint{position:fixed;inset:0;z-index:50;background:#000;color:var(--gold);display:none;
     align-items:center;justify-content:center;text-align:center;font-size:5vmin;padding:8vmin;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<!-- Touch controls -->
<div id="touch">
  <div id="stick" class="pad"><div id="knob"></div></div>
  <div id="btns" class="pad">
    <div id="bD" class="btn">DODGE</div>
    <div id="bX" class="btn">SPEC</div>
    <div id="bS" class="btn">SUPER</div>
    <div id="bJ" class="btn">JUMP</div>
    <div id="bB" class="btn">HEAVY</div>
    <div id="bA" class="btn">PUNCH</div>
  </div>
</div>

<!-- DOM screens for menus/dialogue (rendered over canvas) -->
<div id="ui">
  <div id="scrTitle" class="screen"></div>
  <div id="scrIntro" class="screen"></div>
  <div id="scrDialogue" class="screen"></div>
  <div id="scrEnding" class="screen"></div>
  <div id="scrPause" class="screen"></div>
</div>

<div id="pauseBtn">❚❚</div>
<div id="rotateHint">↻ Rotate your phone, or just keep playing in portrait — both work!</div>

<script>
/* ================================================================
   ╔══════════════════════════════════════════════════════════╗
   ║  SAMI SUPREME — single-file 16-bit brawler                 ║
   ║                                                            ║
   ║  >>> EDIT POINTS (search these tags) <<<                   ║
   ║    [EDIT:DIALOGUE]  — all talk/fight script + boss lines   ║
   ║    [EDIT:ENEMIES]   — enemy & boss stats / attack tuning   ║
   ║    [EDIT:SPECIALS]  — special-move + super tuning          ║
   ║    [EDIT:ENDINGS]   — ending text variants                 ║
   ╚══════════════════════════════════════════════════════════╝
   ================================================================ */

/* ---------- internal resolution (16:9, SNES-ish) ---------- */
const VW = 480, VH = 270;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* =====================================================================
   [EDIT:ENEMIES]  Enemy & boss stats.
   hp        : health
   speed     : walk speed (px/frame)
   dmgLight  : contact/attack damage
   reach     : attack range (px)
   atkCd     : frames between attacks (lower = more aggressive)
   w,h       : hitbox size
   color     : sprite palette base
   ===================================================================== */
const ENEMY_STATS = {
  // ---- minor mooks ----
  scrub:    { name:"Softball Scrub",  hp:34,  speed:0.9, dmg:5,  reach:34, atkCd:80,  w:30,h:54, color:'#c46', tier:'minor', kit:'scrub' },
  cone:     { name:"Road Cone Goon",  hp:26,  speed:1.3, dmg:4,  reach:30, atkCd:70,  w:26,h:50, color:'#e87', tier:'minor', kit:'cone' },
  fan:      { name:"Bleacher Fan",    hp:42,  speed:0.7, dmg:6,  reach:36, atkCd:95,  w:32,h:56, color:'#7a6', tier:'minor', kit:'fan' },
  // ---- bosses ----
  catcher:  { name:"The Catcher",   realName:"Buck 'Mitts' Delgado",  hp:120, speed:0.8, dmg:9,  reach:42, atkCd:78,  w:40,h:62, color:'#5b8', tier:'boss', special:'pounce', kit:'catcher' },
  pitcher:  { name:"The Pitcher",   realName:"Hank 'The Arm' Boyle",  hp:140, speed:1.0, dmg:10, reach:46, atkCd:70,  w:36,h:64, color:'#48a', tier:'boss', special:'fastball', kit:'pitcher' },
  shortstop:{ name:"The Shortstop", realName:"Rosa 'Pivot' Nakamura", hp:150, speed:1.5, dmg:9,  reach:40, atkCd:58,  w:34,h:60, color:'#da5', tier:'boss', special:'dashtag', kit:'shortstop' },
  outfield: { name:"The Outfielders", realName:"Cal & Earl Tuttle",   hp:170, speed:1.1, dmg:11, reach:44, atkCd:64,  w:38,h:62, color:'#6a4', tier:'boss', special:'flyball', kit:'outfield' },
  coach:    { name:"The Coach",     realName:"Coach Don Pyle",        hp:200, speed:0.7, dmg:13, reach:48, atkCd:84,  w:44,h:66, color:'#963', tier:'boss', special:'whistle', kit:'coach' },
  twinA:    { name:"Sister Dot",    realName:"Dot Vance",             hp:150, speed:1.2, dmg:10, reach:42, atkCd:72,  w:34,h:60, color:'#e6a', tier:'boss', special:'tandem', kit:'twinA' },
  twinB:    { name:"Sister Junie",  realName:"Junie Vance",           hp:150, speed:1.2, dmg:10, reach:42, atkCd:72,  w:34,h:60, color:'#b8e', tier:'boss', special:'tandem', kit:'twinB' },
};

/* =====================================================================
   [EDIT:SPECIALS]  Player move tuning.
   ===================================================================== */
const PLAYER = {
  maxHp: 130,
  walk: 2.1, run: 3.0, jump: 7.4, gravity: 0.42,
  dmgLight: 7, dmgHeavy: 15,
  lightReach: 40, heavyReach: 46,
  comboWindow: 30,             // frames to chain next attack
  dodgeFrames: 20, dodgeSpeed: 5.2, dodgeIFrames: 14,
  blockReduce: 0.25,           // damage taken while blocking (×)
  meterPerHitDealt: 7, meterPerHitTaken: 5, meterMax: 100,
};
const SPECIALS = {
  // cost = super meter spent; dmg, etc.
  slam:    { name:"SUPREME SLAM",      cost:35, dmg:26, reach:54, knock:7,  label:"X" },
  kickflip:{ name:"COLORADO KICKFLIP", cost:35, dmg:22, reach:60, knock:5,  label:"X+→" },
  // SUPER (full meter screen-clear)
  superMove:{ name:"SAMI SUPREME!!",   cost:100, dmg:55, label:"SUPER" },
};

/* =====================================================================
   [EDIT:DIALOGUE]  Every boss intro, talk branch, and reason.
   Each stage's "talk" is a tiny tree. Pick the de-escalating /
   empathetic / absurdity-calling option to make them stand down.
   correct: index of the line that resolves peacefully.
   ===================================================================== */
const STAGES = [
  {
    id:'catcher', title:"STAGE 1 — Garden of the Gods",
    sub:"Red Rock Sandlot · Colorado Springs", minor:['scrub','cone'], boss:'catcher',
    intro:"BUCK 'MITTS' DELGADO — THE CATCHER — plants himself among the red sandstone spires, fully padded.\n\"You can't leave, Sami. Who's gonna catch for me?\"",
    reason:"He genuinely cannot pitch to no one. Existential.",
    talk:{ q:`Buck won't budge from the trail, glove up. What do you lead with?`, a:[
        {t:`"Buck... what's this really about?"`, r:`He deflates a little. "...I caught every game in this town for twenty years. If you go — who do I crouch down for?"`,
         to:{ q:`He's not angry. He's scared. Where do you take it?`, a:[
           {t:`"You're not 'the catcher.' You're Buck. That doesn't leave when I do."`, ok:true,
            r:`He pulls the mask off, eyes shining. "...Huh. Nobody ever told me the position wasn't the person." He swings the gate open.`},
           {t:`"They make pitch-back nets, man. Twenty bucks at the sporting-goods store."`, ok:true,
            r:`"...A NET." He laughs — the kind that's mostly relief. "All this, and the answer was twenty bucks." He steps aside.`},
           {t:`"Honestly? Crouch for someone else. Not my problem."`, fight:true,
            r:`The warmth drains out of his face. "...Wow." Mask down. FIGHT.`},
         ]}},
        {t:`"Move it, Mitts, I've got a bus to catch."`, fight:true,
         r:`"You do NOT get to nickname me and then leave." FIGHT.`},
        {t:`"I was always more of a designated hitter anyway."`, fight:true,
         r:`"BLASPHEMY. In MY dugout." FIGHT.`},
      ]},
  },
  {
    id:'pitcher', title:"STAGE 2 — Royal Gorge Bridge",
    sub:"1,000 ft over the Arkansas River", minor:['cone','scrub','fan'], boss:'pitcher',
    intro:"HANK 'THE ARM' BOYLE — THE PITCHER — winds up at the mouth of the Royal Gorge Bridge.\n\"Leaving means I never get my no-hitter back.\"",
    reason:"Blames Sami's old error in '09 for ending the streak.",
    talk:{ q:`Hank winds up at the lip of the gorge, glaring. Your move.`, a:[
        {t:`"Just say it, Hank. What did I do?"`, r:`"Bottom of the ninth, two-thousand-nine. You booted a routine grounder. My no-hitter — gone. Sixteen years and I still see it."`,
         to:{ q:`Sixteen years he's carried this. How do you set it down?`, a:[
           {t:`"I've replayed that grounder every day too, Hank. We both lost something that night."`, ok:true,
            r:`The ball lowers. "...You think about it too?" Something un-knots in his shoulders. "Maybe it wasn't only mine to carry." He sits on the curb.`},
           {t:`"It was one ground ball, in a beer-league game, in 2009."`, ok:true,
            r:`He opens his mouth to argue and... can't. "...When you put it like that." He pockets the ball, embarrassed and lighter.`},
           {t:`"Your curveball hung all night. Don't pin it on me."`, fight:true,
            r:`His eye twitches. "HUNG?!" FIGHT.`},
         ]}},
        {t:`"Throw it, then. I dare you."`, fight:true, r:`"DON'T MIND IF I DO." FIGHT.`},
        {t:`"You peaked at eighteen, Hank."`, fight:true, r:`That one lands square. FIGHT.`},
      ]},
  },
  {
    id:'shortstop', title:"STAGE 3 — Red Rocks Amphitheatre",
    sub:"Row 1, center stage · Morrison", minor:['fan','scrub','cone'], boss:'shortstop',
    intro:"ROSA 'PIVOT' NAKAMURA — THE SHORTSTOP — vaults down the Red Rocks stage steps.\n\"If you go, who covers second on the double play?\"",
    reason:"Obsessed with one perfect turn that never happened.",
    talk:{ q:`Rosa vaults the stage rail and blocks the steps. Talk fast.`, a:[
        {t:`"You okay, Rosa? Because this isn't really about second base."`, r:`"...We never turned it. The perfect one. You-to-me-to-first, clean as glass. Then one spring you just... stopped showing up."`,
         to:{ q:`It isn't the play she misses. What do you give her?`, a:[
           {t:`"You were the best infielder this town ever had. You don't need the play to prove it."`, ok:true,
            r:`She lowers the glove. "...I think I needed somebody to have SEEN it. And you did." She nods you toward the door.`},
           {t:`"Come out to Chicago. We'll find a beer league and turn ten of them."`, ok:true,
            r:`A real smile cracks through. "...Yeah?" "Yeah." "...Okay. Go — before I make you pinky-swear on it."`},
           {t:`"A double play takes two people, Rosa. You'll manage on your own."`, fight:true,
            r:`Exactly the wrong words. "On my OWN—" FIGHT.`},
         ]}},
        {t:`"Range was never your problem. Range OUT of my way."`, fight:true, r:`"Oh, it's RANGE you want—" FIGHT.`},
        {t:`"Second base is overrated."`, fight:true, r:`The whole amphitheatre gasps. FIGHT.`},
      ]},
  },
  {
    id:'outfield', title:"STAGE 4 — Great Sand Dunes",
    sub:"The deepest field in Colorado", minor:['scrub','fan','cone','scrub'], boss:'outfield',
    intro:"CAL & EARL TUTTLE — THE OUTFIELDERS — rise from the dunes, gloves up.\n\"Nothing gets past us. Nothing LEAVES past us.\"",
    reason:"They've guarded this 'deep field' so long they forgot why.",
    talk:{ q:`Cal and Earl rise from the dunes, gloves up, blocking the way. How do you hail them?`, a:[
        {t:`"Fellas — how long have you two been out here, exactly?"`, r:`They glance at each other. "...What inning is it, Earl?" "Couldn't tell ya, Cal. Sun's come up twice."`,
         to:{ q:`They genuinely don't know the game ended. Break it gently?`, a:[
           {t:`"The game ended a long, long time ago. You can come in now. It's okay."`, ok:true,
            r:`A long pause. "...Game's over?" "We can go home?" The gloves drop. The corn parts like a stage curtain.`},
           {t:`"There's no fly ball coming. No batter. It's just sand out here, guys."`, ok:true,
            r:`"...Just sand." "Huh." "...I could really go for a sandwich, Cal." They amble off toward lunch at last.`},
           {t:`"I'm a deep fly ball and I am GONE!"`, fight:true, r:`"WE'VE GOT IT! WE'VE GOT IT!" FIGHT.`},
         ]}},
        {t:`"Cut-off man's wide open, you ball-hawks."`, fight:true, r:`They take it personally. FIGHT.`},
        {t:`"You two were always bench players anyway."`, fight:true, r:`"BENCH?!" (in stereo) FIGHT.`},
      ]},
  },
  {
    id:'coach', title:"STAGE 5 — Denver Union Station",
    sub:"Last train out of the Mile High City", minor:['fan','scrub','fan','cone'], boss:'coach',
    intro:"COACH DON PYLE — THE COACH — stands under the great Union Station clock, clipboard in hand.\n\"I made you, Sami. You don't get to walk off MY roster.\"",
    reason:"Can't admit a player outgrew the team — and the town.",
    talk:{ q:`Coach Pyle stands under the great clock, clipboard held like a shield. What do you give him?`, a:[
        {t:`"Coach. Look at me. Why are you really standing out here?"`, r:`The clipboard wavers. "...Forty years I built ballplayers in this town. And every good one... leaves. I just wanted ONE of you to stay."`,
         to:{ q:`This is the realest anyone's been all trip. Answer him true.`, a:[
           {t:`"You didn't build us to keep us, Coach. You built us to send somewhere. You did your job — perfectly."`, ok:true,
            r:`His jaw works. He sets the clipboard down — actually down. "...Run it out, kid. All ninety feet. Don't you DARE jog." He waves you through.`},
           {t:`"Then come to a game in Chicago. Front row. I'll leave a ticket at will-call every time."`, ok:true,
            r:`"...A ticket." The toughest man in three counties studies his shoes. "...I'd like that. Now go, before I bench you out of spite."`},
           {t:`"That's not my problem to fix, Coach."`, fight:true, r:`The clipboard hits the pavement. "Then we do this the dugout way." FIGHT.`},
         ]}},
        {t:`"You benched me my whole life. We're done."`, fight:true, r:`"Then we settle it the dugout way." FIGHT.`},
        {t:`"Your lineup card was always trash."`, fight:true, r:`The whistle SHRIEKS. FIGHT.`},
      ]},
  },
  {
    id:'twins', title:"STAGE 6 — Maroon Bells",
    sub:"The Twin Peaks · Maroon Lake", minor:[], boss:'twins',
    intro:"On the shore of Maroon Lake, beneath the twin peaks, wait DOT and JUNIE VANCE — the twins.\nYour sisters. They are not padded up like the others.\n\"You really packed a bag,\" Dot says.\n\"You weren't even gonna say goodbye,\" says Junie.",
    reason:"They can't accept being the ones left behind.",
    // Twin talk tree is gated/extended by peaceProgress at runtime (see startTwinDialogue).
    talk:null,
  },
];

/* [EDIT:DIALOGUE]  Opening story — Sami's escape plan (shown after the title). */
const INTRO_TEXT =
"SAMI VANCE has lived in Bell Hollow, Colorado her whole life.\n"+
"Population 1,140. One diner. One stoplight. One softball team.\n\n"+
"THE PLAN: slip out before Saturday's game. Drive east across the whole\n"+
"state — the red rocks, the gorge, the dunes, Denver — and don't stop,\n"+
"not once, until the Chicago skyline comes up over the lake.\n\n"+
"In the duffel: two shirts, $312, and a one-way ticket bought in cash\n"+
"so nobody would see it on the books.\n\n"+
"The catch: in a town this small, EVERYONE already knows. The whole\n"+
"team has lined up clear across Colorado to stop her.\n\n"+
"And waiting at the very last stop — Maroon Bells, where the twin peaks\n"+
"meet the water — are her own twin sisters, Dot and Junie.";

/* =====================================================================
   [EDIT:ENDINGS]  Ending text varies by record. {peace} fills in count.
   ===================================================================== */
const ENDINGS = {
  // chosen by peaceProgress (0..5 possible before twins) + twin resolution
  warm: {
    title:"CHICAGO.",
    body:[
      "Sami crosses the Colorado line with Chicago waiting somewhere east,",
      "and Dot and Junie are still back at the lake — but they're waving now,",
      "not blocking. The bag feels lighter. The phone will ring on Sundays.",
      "",
      "You talked down {peace} of the people who tried to stop you.",
      "You reached your sisters instead of beating them.",
      "",
      "A fresh start. And a family you didn't have to lose to get it.",
    ],
  },
  cold: {
    title:"CHICAGO.",
    body:[
      "Sami crosses the Colorado line. The Chicago skyline waits, exactly as imagined.",
      "Behind, the road is quiet. Dot and Junie don't wave.",
      "",
      "You fought your way out. Every single one of them. Including them.",
      "Peaceful talk-downs: {peace}.",
      "",
      "A fresh start — bought with bruises, and a silence on Sundays",
      "that you'll get used to. Probably.",
    ],
  },
  mixed: {
    title:"CHICAGO.",
    body:[
      "Sami crosses the line out of Colorado, Chicago-bound. New air, new everything.",
      "You talked your way past {peace} of them and threw hands with the rest.",
      "",
      "Dot and Junie watch you go. It's not a wave. It's not nothing, either.",
      "",
      "A fresh start. The hard part — the part that wasn't a fight —",
      "is the part you'll keep thinking about on the train.",
    ],
  },
};

/* ================================================================
   ENGINE
   ================================================================ */
const GS = { TITLE:'title', INTRO:'intro', MAP:'map', DIALOGUE:'dialogue', COMBAT:'combat', ENDING:'ending' };
let state = GS.TITLE;
let stageIdx = 0;
let peaceProgress = 0;
let fightCount = 0;
let twinResolution = 'cold'; // 'warm' if reached peacefully

/* input */
const keys = {};
const input = { left:0, right:0, up:0, down:0, light:0, heavy:0, jump:0, special:0, dodge:0, super:0,
                _light:0,_heavy:0,_jump:0,_special:0,_dodge:0,_super:0 }; // _x = edge (just pressed)
function setBtn(name,v){
  if(v && !input[name]) input['_'+name]=1;
  input[name]=v?1:0;
}
const KEYMAP = {
  ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right',
  ArrowUp:'up', w:'up', ArrowDown:'down', s:'down',
  j:'light', k:'heavy', l:'special', ' ':'jump',
  Shift:'dodge', u:'super',
};
addEventListener('keydown', e=>{
  const m = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase?.()];
  if(m){ setBtn(m,1); e.preventDefault(); }
  if(state===GS.TITLE && (e.key==='Enter'||e.key===' ')) startGame();
  if(e.key==='Escape' || e.key==='p' || e.key==='P'){ togglePause(); }
});
addEventListener('keyup', e=>{
  const m = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase?.()];
  if(m){ setBtn(m,0); e.preventDefault(); }
});

/* touch buttons */
function bindBtn(id,name){
  const el=document.getElementById(id);
  const dn=e=>{e.preventDefault();setBtn(name,1);};
  const up=e=>{e.preventDefault();setBtn(name,0);};
  el.addEventListener('touchstart',dn,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up);
  el.addEventListener('mouseleave',up);
}
bindBtn('bA','light'); bindBtn('bB','heavy'); bindBtn('bJ','jump');
bindBtn('bX','special'); bindBtn('bD','dodge'); bindBtn('bS','super');
/* pause button */
(function(){ const pb=document.getElementById('pauseBtn');
  const f=e=>{ e.preventDefault(); togglePause(); };
  pb.addEventListener('touchstart',f,{passive:false}); pb.addEventListener('click',f); })();

/* touch stick */
(function(){
  const stick=document.getElementById('stick'), knob=document.getElementById('knob');
  let id=null,cx=0,cy=0,R=1;
  function start(e){
    const t=e.changedTouches?e.changedTouches[0]:e;
    const r=stick.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2; R=r.width/2; id=t.identifier??'m';
    move(e);
  }
  function move(e){
    let t;
    if(e.changedTouches){ for(const c of e.changedTouches){ if(c.identifier===id){t=c;break;} } if(!t)return; }
    else t=e;
    let dx=t.clientX-cx, dy=t.clientY-cy;
    const dist=Math.hypot(dx,dy)||1, max=R;
    if(dist>max){ dx*=max/dist; dy*=max/dist; }
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    const nx=dx/max, ny=dy/max, dead=0.28;
    setBtn('left', nx<-dead); setBtn('right', nx>dead);
    setBtn('up', ny<-dead);   setBtn('down', ny>dead);
  }
  function end(e){
    if(e.changedTouches){ let hit=false; for(const c of e.changedTouches){ if(c.identifier===id)hit=true; } if(!hit)return; }
    id=null; knob.style.transform='translate(-50%,-50%)';
    setBtn('left',0);setBtn('right',0);setBtn('up',0);setBtn('down',0);
  }
  stick.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});
  stick.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
  stick.addEventListener('touchend',e=>{e.preventDefault();end(e);},{passive:false});
  stick.addEventListener('touchcancel',e=>{e.preventDefault();end(e);},{passive:false});
})();

let player=null, enemies=[], camX=0, stageW=VW*2.4;
let goGate=false, goBlink=0;
let resolving=false; // guards one-shot transitions (boss defeat / player down)
let bannerText='', bannerT=0;

/* ================================================================
   COMBAT LOOP
   ================================================================ */
function startCombat(){
  state=GS.COMBAT;
  hideAllScreens(); showTouch(true);
  camX=0; goGate=false; resolving=false; floaters=[];
  player = makeFighter(60, {w:32,h:60,hp:PLAYER.maxHp}, true);
  player.maxHp=PLAYER.maxHp; player.hp=PLAYER.maxHp;
  player.y=GROUND;

}
let encounterMode='minor'; // 'minor' or 'boss'
let pendingBoss=null;

function buildEncounter(){
  const st=STAGES[stageIdx];
  enemies=[]; resolving=false;
  if(encounterMode==='minor'){
    const list=st.minor;
    stageW=VW*2.2;
    list.forEach((type,i)=>{
      const e=makeFighter(VW*0.9 + i*120 + Math.random()*40, ENEMY_STATS[type]);
      e.y=GROUND; enemies.push(e);
    });
    banner(st.title.toUpperCase());
  } else {
    // boss
    stageW=VW*1.3; camX=0;
    if(st.boss==='twins'){
      const a=makeFighter(VW*0.78, ENEMY_STATS.twinA); a.y=GROUND;
      const b=makeFighter(VW*0.95, ENEMY_STATS.twinB); b.y=GROUND;
      a.partner=b; b.partner=a; enemies.push(a,b);
      banner("DOT & JUNIE");
    } else {
      const e=makeFighter(VW*0.82, ENEMY_STATS[st.boss]); e.y=GROUND;
      enemies.push(e);
      banner(ENEMY_STATS[st.boss].name.toUpperCase());
    }
  }

}
function banner(t){ bannerText=t; bannerT=110; }

/* physics + AI per frame */
function updateCombat(){
  if(hitstop>0){ hitstop--; return; }

  // ---- player ----
  updatePlayer();

  // ---- enemies ----
  let alive=0;
  enemies.forEach(e=>{ if(!e.dead) alive++; updateEnemy(e); });

  // camera follows player
  const target = clamp(player.x - VW*0.42, 0, stageW-VW);
  camX += (target-camX)*0.12;

  // GO gate when minor wave cleared
  if(encounterMode==='minor' && alive===0 && !goGate){ goGate=true; }
  if(goGate){
    goBlink++;
    // walking to right edge advances
    if(player.x > stageW-50){
      goGate=false;
      // proceed to boss dialogue
      startBossDialogue();
    }
  }

  // boss cleared?
  if(encounterMode==='boss' && alive===0 && !resolving){
    resolving=true; bossDefeated();
  }

  // timers
  if(shake>0) shake-=1;
  if(flash>0) flash-=0.08;
  floaters.forEach(f=>{ f.y-=0.6; f.life--; });
  floaters=floaters.filter(f=>f.life>0);
  if(bannerT>0) bannerT--;
  if(comboTextT>0) comboTextT--;
}

function updatePlayer(){
  const p=player; p.anim++;
  if(p.dead) return;
  const sp=p.stats;
  // timers
  if(p.atkCdT>0)p.atkCdT--;
  if(p.hurtT>0)p.hurtT--;
  if(p.iframes>0)p.iframes--;
  if(p.comboT>0)p.comboT--; else p.combo=0;
  if(p.flashT>0)p.flashT--;

  const busy = p.state==='attack'||p.state==='special'||p.state==='super'||p.state==='dodge'||p.hurtT>5;

  // dodge
  if(input._dodge && p.onGround && p.state!=='dodge' && p.dodgeT<=0){
    p.state='dodge'; p.dodgeT=PLAYER.dodgeFrames; p.iframes=PLAYER.dodgeIFrames;
    p.vx = p.face*PLAYER.dodgeSpeed;
  }
  // block (hold down+back? simpler: hold 'down' or no input while pressing nothing). Use: holding away+nothing.
  p.blocking = (input.down && p.onGround && !busy);

  // movement
  if(p.state!=='dodge' && p.state!=='attack' && p.state!=='special' && p.state!=='super'){
    let mv=0;
    if(input.left) mv-=1;
    if(input.right) mv+=1;
    if(mv!==0 && !p.blocking){
      p.face=mv;
      p.vx = mv*(input.down?PLAYER.walk*0.6:PLAYER.walk);
      if(p.onGround && p.state!=='special') p.state='walk';
    } else {
      p.vx*=0.6;
      if(p.onGround && Math.abs(p.vx)<0.3 && p.state!=='special') p.state= p.blocking?'block':'idle';
    }
  }
  // jump
  if(input._jump && p.onGround && input.down && p.platform){      // drop THROUGH a platform
    p.platform=null; p.onGround=false; p.dropT=12; p.y+=2;
  } else if(input._jump && p.onGround && !p.blocking){             // normal jump
    p.vy=-PLAYER.jump; p.onGround=false; p.state='jump'; p.platform=null;
  }

  // attacks
  if(p.atkCdT<=0 && !p.blocking && p.state!=='dodge'){
    if(input._light){ startAttack(p,'light'); }
    else if(input._heavy){ startAttack(p,'heavy'); }
    else if(input._special && p.meter>=SPECIALS.slam.cost){ startSpecial(p); }
    else if(input._super && p.meter>=PLAYER.meterMax){ startSuper(p); }
  }

  // dodge resolve
  if(p.state==='dodge'){ p.dodgeT--; if(p.dodgeT<=0){ p.state='idle'; p.vx*=0.3; } }

  // attack resolve
  if(p.state==='attack'||p.state==='special'||p.state==='super'){
    p.attackT--;
    resolvePlayerHit(p);
    if(p.attackT<=0){ p.state='idle'; p.hasHit=false; p.attackType=null; }
  }

  applyPhysics(p);
  clearEdges();
}

function startAttack(p,type){
  // combo chain
  if(p.comboT>0) p.combo++; else p.combo=1;
  p.comboT=PLAYER.comboWindow;
  p.state='attack'; p.attackType=type; p.hasHit=false;
  p.attackT = type==='light'?16:24;
  p.atkCdT = type==='light'?14:26;
  if(input.right||input.left){} // face already set
}
function startSpecial(p){
  // choose based on direction held: forward = kickflip, else slam
  const mv = (input.left||input.right);
  p.special = (input.left||input.right) ? 'kickflip' : 'slam';
  const s=SPECIALS[p.special];
  p.meter=Math.max(0,p.meter-s.cost);
  p.state='special'; p.attackType=p.special; p.hasHit=false; p.attackT=30; p.atkCdT=30;
  screenFlash(0.4,'#9cf');
  floatText(p.x, p.y-p.h-6, s.name, '#9cf');
}
function startSuper(p){
  p.meter=0; p.state='super'; p.attackType='super'; p.hasHit=false; p.attackT=70; p.atkCdT=70;
  screenFlash(1.0,'#fff'); addShake(10);
  floatText(p.x, p.y-p.h-10, SPECIALS.superMove.name, '#ff5');
}

function resolvePlayerHit(p){
  let reach, dmg, knock=4, isSuper=false, isSpecial=false;
  if(p.attackType==='light'){ reach=PLAYER.lightReach; dmg=PLAYER.dmgLight; if(p.attackT>11)return; }
  else if(p.attackType==='heavy'){ reach=PLAYER.heavyReach; dmg=PLAYER.dmgHeavy; knock=6; if(p.attackT>16)return; }
  else if(p.attackType==='slam'||p.attackType==='kickflip'){
    const s=SPECIALS[p.attackType]; reach=s.reach; dmg=s.dmg; knock=s.knock; isSpecial=true; if(p.attackT>20)return;
  }
  else if(p.attackType==='super'){
    // screen-clear: hits all enemies repeatedly
    isSuper=true; reach=9999; dmg=SPECIALS.superMove.dmg/6; knock=8;
    if(p.attackT%8!==0) return;
  }
  enemies.forEach(e=>{
    if(e.dead) return;
    const dx=(e.x - p.x)*p.face;
    const close = isSuper || (dx>-10 && dx<reach && Math.abs(e.y-p.y)<50);
    if(close && (!p.hasHit || isSuper)){
      hitEnemy(e, dmg, p.face, knock, isSpecial||isSuper);
      if(!isSuper) p.hasHit=true;
      // combo display
      if(!isSuper){ comboTextVal=p.combo; comboTextT= p.combo>1?50:0; }
      p.meter=Math.min(PLAYER.meterMax, p.meter+PLAYER.meterPerHitDealt);
    }
  });
}

function hitEnemy(e,dmg,dir,knock,big){
  if(e.iframes>0) return;
  e.hp-=dmg; e.flashT=8; e.hurtT=18;
  e.vx = dir*knock; e.vy = big?-2.5:-1;
  e.state='hit';
  floatText(e.x, e.y-e.h-4, '-'+Math.round(dmg), big?'#ff5':'#fff');
  addShake(big?6:3); doHitstop(big?6:3); screenFlash(big?0.5:0.18, big?'#ff8':'#fff');
  if(e.hp<=0){ e.hp=0; e.dead=true; e.deadT=0; e.state='ko'; floatText(e.x,e.y-e.h-10,'K.O.','#f55'); }
}

function updateEnemy(e){
  e.anim++;
  if(e.dead){ e.deadT++; e.vy+=PLAYER.gravity; e.y+=e.vy; if(e.y>GROUND)e.y=GROUND; return; }
  if(e.flashT>0)e.flashT--;
  if(e.hurtT>0)e.hurtT--;
  if(e.iframes>0)e.iframes--;
  if(e.atkCdT>0)e.atkCdT--;
  const s=e.stats;
  e.face = (player.x < e.x)?-1:1;

  if(e.hurtT>6){ applyPhysics(e); return; } // staggered

  const dx = player.x - e.x;
  const adist = Math.abs(dx);

  // telegraph + attack
  if(e.telegraphT>0){
    e.telegraphT--; e.vx*=0.7;
    if(e.telegraphT<=0){
      // strike
      if(adist < s.reach+8 && Math.abs(player.y - e.y) < 42 && player.iframes<=0 && !player.dead){
        let dealt = s.dmg;
        if(player.blocking){ dealt*=PLAYER.blockReduce; floatText(player.x,player.y-player.h-4,'BLOCK','#8cf'); addShake(2);}
        else { addShake(4); doHitstop(3); screenFlash(0.2,'#f88'); }
        player.hp-=dealt; player.flashT=8; player.hurtT=player.blocking?6:16;
        player.vx = e.face*(player.blocking?1.5:3.5); player.vy=player.blocking?0:-1.5;
        if(!player.blocking) floatText(player.x,player.y-player.h-4,'-'+Math.round(dealt),'#f66');
        player.meter=Math.min(PLAYER.meterMax,player.meter+PLAYER.meterPerHitTaken);
        if(player.hp<=0){ player.hp=0; playerDown(); }
      }
      e.atkCdT=s.atkCd;
    }
    applyPhysics(e); return;
  }

  // approach
  if(adist > s.reach-4){
    e.vx = (dx>0?1:-1)*s.speed;
    e.state='walk';
  } else {
    e.vx*=0.6;
    e.state='idle';
    if(e.atkCdT<=0){
      e.telegraphT = 16; e.state='wind'; // wind-up tell
    }
  }
  // boss special occasionally
  if(s.tier==='boss' && e.atkCdT<=0 && Math.random()<0.012){
    e.telegraphT=22; e.special=true;
  }

  applyPhysics(e);
}

function applyPhysics(f){
  if(f.isPlayer && f.dropT>0) f.dropT--;
  f.x += f.vx;
  if(!f.onGround || f.vy<0){
    f.vy+=PLAYER.gravity; const prevY=f.y; f.y+=f.vy;
    let landed=false;
    if(f.isPlayer && f.vy>0 && f.dropT<=0){           // one-way platform landing
      for(const p of platforms){
        if(f.x>p.x && f.x<p.x+p.w && prevY<=p.y+5 && f.y>=p.y){
          f.y=p.y; f.vy=0; f.onGround=true; f.platform=p;
          if(f.state==='jump')f.state='idle'; landed=true; break;
        }
      }
    }
    if(!landed){
      if(f.y>=GROUND){ f.y=GROUND; f.vy=0; f.onGround=true; f.platform=null; if(f.isPlayer&&f.state==='jump')f.state='idle'; }
      else f.onGround=false;
    }
  } else if(f.isPlayer && f.platform){                // walked off the edge?
    const p=f.platform;
    if(f.x<=p.x || f.x>=p.x+p.w){ f.onGround=false; f.platform=null; }
    else f.y=p.y;
  }
  f.x = clamp(f.x, 16, stageW-16);
}

}

  return `<svg width='${size}' height='${size}' viewBox='0 0 16 16' shape-rendering='crispEdges' style='display:block;border:2px solid #0d0a16;border-radius:4px;background:${p.bg};image-rendering:pixelated;'>`+

    `<rect x='6' y='10' width='4' height='1' fill='#9a5a4a'/>${p.gear}</svg>`;
}
function portraitCol(who,size){
  const list=Array.isArray(who)?who:(who?[who]:[]);

  return `<div style="display:flex;flex-direction:column;gap:6px;margin-right:12px;flex:0 0 auto;">${list.map(k=>portrait(k,size||50)).join('')}</div>`;
}

/* ================================================================
   RENDER
   ================================================================ */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function render(){
  gTick++;
  ctx.clearRect(0,0,VW,VH);
  // shake offset
  let ox=0,oy=0;
  if(shake>0){ ox=(Math.random()-0.5)*shake; oy=(Math.random()-0.5)*shake; }
  ctx.save(); ctx.translate(ox,oy);

  if(state===GS.COMBAT){ drawStageBg(); drawWorld(); }
  else if(state===GS.MAP){ drawMapScreen(); }
  else if(state===GS.TITLE){ drawTitleScreen(); }
  else if(state===GS.DIALOGUE){ drawStageBg(); drawWorld(true); }
  else if(state===GS.INTRO){ drawTitleScreen(); }
  else if(state===GS.ENDING){ drawEndingBg(); }

  ctx.restore();

  // flash
  if(flash>0){ ctx.globalAlpha=Math.min(0.8,flash); ctx.fillStyle=flashColor; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
}

/* ---- parallax backgrounds per stage ---- */
/* =====================================================================
   UPGRADED PER-STAGE ART  (each battle location is unique)
   ===================================================================== */
function bgGrad(stops){ const g=ctx.createLinearGradient(0,0,0,VH); stops.forEach(p=>g.addColorStop(p[0],p[1])); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH); }
function cloud(x,y,w,col){ x=Math.round(x);y=Math.round(y); col=col||'rgba(255,255,255,0.9)';
  px(x,y,w,5,col); px(x+6,y-4,w-14,5,col); px(x+w-10,y-2,8,5,col); }
function stars(){ for(let i=0;i<55;i++){ const x=(i*89)%VW, y=(i*53)%Math.round(VH*0.55); const t=(gTick+i*9)%90; px(x,y,1,1, t<45?'#fff':'#9fb'); } }
function vignette(){ const g=ctx.createRadialGradient(VW/2,VH*0.42,VH*0.32, VW/2,VH*0.5,VH*0.9);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(6,3,14,0.42)'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH); }
function skyline(off,baseY,col,winCol,step,hMin,hMax){
  for(let i=-1;i<VW/step+2;i++){ const x=Math.round((i*step)-(off%step)); const h=hMin+((i*47)%(hMax-hMin));
    px(x,baseY-h,step-3,h,col);
    if(winCol) for(let wy=5;wy<h-4;wy+=8) for(let wx=3;wx<step-7;wx+=7) if(((i*7+wx+wy)*13)%5<2) px(x+wx,baseY-h+wy,3,4,winCol);
  }
}
function groundBase(c1,c2,line){
  px(0,GROUND+16,VW,VH,c1);
  for(let i=0;i<VW/14+2;i++){ const gx=((i*14)-(Math.round(camX)%14)); px(gx,GROUND+16,7,3,c2); }
  if(line){ px(0,GROUND+22,VW,2,line); }
}
function dashLine(y,col){ for(let i=0;i<VW/26+2;i++){ const gx=((i*26)-(Math.round(camX)%26)); px(gx,y,14,2,col); } }

function drawStageBg(){
  const c=camX;
  switch(stageIdx){
    case 0: bg0(c); break; case 1: bg1(c); break; case 2: bg2(c); break;
    case 3: bg3(c); break; case 4: bg4(c); break; default: bg5(c); break;
  }
  vignette();
}
/* ===== Stage 1 — GARDEN OF THE GODS (clear morning, red sandstone spires) ===== */
function bg0(c){
  bgGrad([[0,'#bfe3f2'],[0.5,'#e8eef0'],[1,'#f3d9b8']]);
  px(58,40,26,26,'#fff4cc'); px(64,46,14,14,'#fffbe6');                 // sun
  cloud(140-((c*0.08)%640),34,40); cloud(440-((c*0.08)%640),52,30);
  for(let i=-1;i<3;i++){ const x=((i*260)-((c*0.18)%260)); ctx.fillStyle='#9fb4cc';   // Pikes Peak far
    ctx.beginPath();ctx.moveTo(x,GROUND+16);ctx.lineTo(x+130,GROUND-72);ctx.lineTo(x+260,GROUND+16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#eef';ctx.beginPath();ctx.moveTo(x+130,GROUND-72);ctx.lineTo(x+112,GROUND-52);ctx.lineTo(x+150,GROUND-52);ctx.closePath();ctx.fill(); }
  const off=c*0.5;
  const fins=[[30,118],[150,150],[262,96],[372,138],[486,112],[600,150]];
  for(const fn of fins){ redfin(fn[0]-(off%720), fn[1]); redfin(fn[0]+720-(off%720), fn[1]); }
  const brx=330-(off%700); px(brx+7,GROUND-24,4,24,'#8a3320');          // Balanced Rock
  ctx.fillStyle='#c25a38'; ctx.beginPath(); ctx.ellipse(brx+9,GROUND-32,17,11,0,0,7); ctx.fill();
  ctx.fillStyle='#9a3c28'; ctx.beginPath(); ctx.ellipse(brx+14,GROUND-30,8,7,0,0,7); ctx.fill();
  groundBase('#7a4630','#6a3c28',null);
}
function redfin(x,h){
  px(x,GROUND+16-h, 30, h, '#b5482e');
  px(x,GROUND+16-h, 8, h, '#cf6a44');                                   // sunlit edge
  px(x+25,GROUND+16-h, 5, h, '#8a3320');                                // shadow edge
  for(let yy=GROUND+16-h+14; yy<GROUND+10; yy+=18) px(x,yy,30,2,'#9a3c28');
  ctx.fillStyle='#b5482e'; ctx.beginPath(); ctx.moveTo(x,GROUND+16-h); ctx.lineTo(x+15,GROUND+2-h); ctx.lineTo(x+30,GROUND+16-h); ctx.closePath(); ctx.fill();
}

/* ===== Stage 2 — ROYAL GORGE BRIDGE (deep gorge, suspension bridge) ===== */
function bg1(c){
  bgGrad([[0,'#5ab0e8'],[0.55,'#9ad2ee'],[1,'#d2e8e2']]);
  px(VW-92,32,28,28,'#fffbe6');
  cloud(120-((c*0.07)%600),30,38); cloud(380-((c*0.07)%600),48,28);
  for(let i=-1;i<4;i++){ const x=((i*230)-((c*0.2)%230));                // canyon walls
    px(x,GROUND-44,96,60,'#9a7a58'); px(x+96,GROUND-26,46,42,'#85684b'); px(x,GROUND-44,96,5,'#b59670'); }
  px(0,GROUND-4,VW,7,'#3f7a86');                                         // river far below
  const off=c*0.5, span=300, topY=GROUND-122, sagY=GROUND-80, deckY=GROUND+15;
  function cableY(t){ return t<0.5 ? topY+(sagY-topY)*(t/0.5) : sagY+(topY-sagY)*((t-0.5)/0.5); }
  for(let i=-1;i<VW/span+2;i++){ const x=((i*span)-(off%span));

    ctx.beginPath(); ctx.moveTo(x,topY); ctx.lineTo(x+span/2,sagY); ctx.lineTo(x+span,topY); ctx.stroke();
    for(let hx=24;hx<span;hx+=24){ const t=hx/span, cy=cableY(t); px(x+hx, cy, 1, deckY-cy, '#b9bcc0'); }
    px(x-4,topY,8,deckY-topY,'#c24a32'); px(x+span-4,topY,8,deckY-topY,'#c24a32');
    px(x-8,topY,16,7,'#a83a26'); px(x+span-8,topY,16,7,'#a83a26');
    px(x-4,GROUND-54,8,5,'#a83a26'); }
  groundBase('#9a7a4a','#876a40',null);
  for(let i=0;i<VW/12+2;i++){ const gx=((i*12)-(Math.round(camX)%12)); px(gx,GROUND+16,1,VH,'#6a522e'); }
}

/* ===== Stage 3 — RED ROCKS AMPHITHEATRE (golden afternoon, giant red monoliths) ===== */
function bg2(c){

  px(0,GROUND-18,VW,34,'#b89a6a');                                       // distant plains/Denver haze

function bigRock(x,h){

  px(x+10,GROUND+16-h,8,h,'#c96a44');                                    // sunlit edge

}

/* ===== Stage 4 — GREAT SAND DUNES (warm, dunes under the Sangre de Cristos) ===== */
function bg3(c){
  bgGrad([[0,'#cfe2ee'],[0.5,'#e8e0c8'],[1,'#e0c894']]);
  px(VW-86,46,24,24,'#fff4d2');
  for(let i=-1;i<4;i++){ const x=((i*200)-((c*0.18)%200)); ctx.fillStyle='#8f7d92';   // Sangre de Cristo
    ctx.beginPath();ctx.moveTo(x,GROUND-18);ctx.lineTo(x+58,GROUND-78);ctx.lineTo(x+108,GROUND-40);ctx.lineTo(x+168,GROUND-86);ctx.lineTo(x+200,GROUND-18);ctx.closePath();ctx.fill();
    px(x+50,GROUND-72,18,9,'#eef'); px(x+158,GROUND-80,18,9,'#eef'); }
  duneRow(GROUND-12, c*0.35, '#dcc088','#c4a466');

}
function duneRow(baseY,off,light,dark){
  for(let i=-1;i<VW/130+2;i++){ const x=((i*130)-(off%130));
    ctx.fillStyle=dark; ctx.beginPath(); ctx.moveTo(x,baseY+24); ctx.quadraticCurveTo(x+64,baseY-26,x+130,baseY+24); ctx.closePath(); ctx.fill();
    ctx.fillStyle=light; ctx.beginPath(); ctx.moveTo(x,baseY+24); ctx.quadraticCurveTo(x+46,baseY-22,x+82,baseY+4); ctx.lineTo(x,baseY+24); ctx.closePath(); ctx.fill(); }
}

/* ===== Stage 5 — DENVER UNION STATION (dusk, Mile High skyline + station) ===== */
function bg4(c){
  bgGrad([[0,'#3a2c5e'],[0.5,'#6b4080'],[1,'#d77a64']]);

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---- world entities ---- */
function drawWorld(noHud){
  drawPlatforms();

  const ents=[player,...enemies].filter(Boolean).sort((a,b)=>a.y-b.y);

    ctx.fillText(bannerText, VW/2, VH/2+8);

  }
  // combo text
  if(comboTextT>0 && comboTextVal>1){
    ctx.fillStyle='#ff5'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
    ctx.fillText(comboTextVal+' HIT!', VW/2, 40);
    ctx.textAlign='left';

  // floaters
  floaters.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.life/20);
    ctx.fillStyle=f.color; ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText(f.txt, f.x-camX, f.y-f.h-6);
    ctx.globalAlpha=1; ctx.textAlign='left';
  });
  if(!noHud) drawHUD();
}

function drawCone(W,H,bob,hurt){

}
function drawKit(kit,W,H,bob,skin,body,f){

      px(-1,top+15,3,H-34,'#e5404a');                        // red tank stripe
      px(-W*0.02,top+14,2,H-32,'#27478a');                   // zipper
      break;
    case 'catcher':

      px(-W*0.30,top+14,W*0.6,H-36,'#3f8a58'); px(-W*0.18,top+16,2,H-40,'#2c6a42'); px(W*0.10,top+16,2,H-40,'#2c6a42'); // chest protector
      break;
    case 'pitcher':

      px(-4,top+16,8,7,'#dfe3ea'); px(-2,top+17,2,5,'#27406e');                   // jersey number patch

function drawFighter(f){
  const sx=Math.round(f.x-camX), sy=Math.round(f.y);
  const s=f.stats; const flip=f.face;
  const kit = f.isPlayer ? 'sami' : (s.kit||'scrub');
  // shadow
  ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, GROUND+16, f.w*0.55, 5, 0,0,7); ctx.fill(); ctx.globalAlpha=1;

  let body = f.isPlayer ? '#3a63b0' : s.color;     // Sami: denim-blue jacket
  let skin = f.isPlayer ? '#f3c89a' : '#e7b487';
  let hair = f.isPlayer ? '#f2d04a' : '#241c14';
  const hurt = (f.flashT>0 && f.flashT%2===0);
  if(hurt) body='#fff';
  const ko=f.dead;
  const bob=(f.state==='walk')?Math.sin(f.anim*0.3)*2:0;
  const yb=sy+(ko?20:0);

  ctx.save(); ctx.translate(sx,yb);
  if(ko) ctx.rotate(flip>0?1.4:-1.4);
  ctx.scale(flip,1);
  const W=f.w,H=f.h;
  const stride=(f.state==='walk')?Math.sin(f.anim*0.3)*5:0;

  // legs (kit-tinted, alternating gait)
  const pant=ENEMY_LEG[kit]||'#2a2a3a';
  px(-W*0.27 - stride*0.45, -18+bob, W*0.21,15, shade(pant,-12));
  px( W*0.06 + stride*0.45, -18+bob, W*0.21,15, pant);
  px(-W*0.29 - stride*0.45, -4+bob, W*0.24,4,'#15151c');   // shoes
  px( W*0.04 + stride*0.45, -4+bob, W*0.24,4,'#15151c');

  if(kit==='cone'){
    drawCone(W,H,bob,hurt);
  } else {
    // torso (shaded)
    px(-W*0.34, -H+12+bob, W*0.68, H-30, body);
    px(-W*0.34, -H+12+bob, W*0.68, 3, shade(body,28));      // top highlight
    px(-W*0.34, -H+12+bob, 3, H-30, shade(body,-26));       // side shade
    px(-W*0.34, -22+bob, W*0.68, 4, shade(body,-42));       // belt
    // head
    px(-W*0.26, -H+bob, W*0.52, 16, skin);
    px(-W*0.26, -H+bob, W*0.52, 3, shade(skin,18));         // forehead highlight
    px(-W*0.26, -H-3+bob, W*0.52, 6, hair);                 // hair top
    px(W*0.0, -H+5+bob, W*0.16,2, shade(skin,-28));         // brow
    px(W*0.04, -H+6+bob, 3,3,'#111');                       // eye
    drawKit(kit,W,H,bob,skin,body,f);
  }

  // arms / attack
  if(kit!=='cone'){
    if(f.state==='attack'||f.state==='special'||f.state==='super'){
      const ext = f.attackType==='heavy'?20:f.attackType==='super'?30:14;
      px(W*0.2, -H+18+bob, W*0.4+ext, 8, skin);
      px(W*0.2+ext-2, -H+17+bob, 6,10, shade(skin,-20));    // fist
      if(f.state==='special'||f.state==='super'){
        px(W*0.2+ext, -H+12+bob, 10, 18, f.state==='super'?'#ff5':'#9cf');
      }
    } else if(f.telegraphT>0){
      px(-W*0.12,-H+4+bob, 9, 9, '#ff0');                    // wind-up flash
      px(W*0.2,-H+15+bob,W*0.32,7,skin);
    } else {
      px(W*0.24,-H+16+bob,W*0.3,7,skin);
      if(kit==='coach'){ px(W*0.30,-H+19+bob,10,13,'#caa46a'); px(W*0.32,-H+21+bob,6,2,'#fff'); px(W*0.32,-H+24+bob,6,2,'#fff'); } // clipboard
      else if(kit==='pitcher'||kit==='shortstop'){ px(W*0.30,-H+17+bob,9,9, shade(pant,-6)); px(W*0.33,-H+19+bob,4,4,shade(pant,-26)); } // glove
      else if(kit==='catcher'){ px(W*0.30,-H+16+bob,11,11,'#caa46a'); px(W*0.33,-H+18+bob,6,6,shade('#caa46a',-24)); } // mitt
    }
  }
  // block pose
  if(f.blocking){ px(W*0.0,-H+14+bob,8,20,'#8cf'); px(W*0.0,-H+14+bob,8,3,'#cef'); }
  // dodge afterimage
  if(f.state==='dodge'){ ctx.globalAlpha=0.4; px(-W*0.34,-H+12+bob,W*0.68,H-30,'#9cf'); ctx.globalAlpha=1; }

  ctx.restore();

  // enemy hp pip (minor only)
  if(!f.isPlayer && !f.dead && s.tier==='minor'){
    const w=24; px(sx-w/2, sy-H-10, w,3,'#400');
    px(sx-w/2, sy-H-10, w*(f.hp/f.maxHp),3,'#f55');
  }
}

/* ---- HUD ---- */
function drawHUD(){
  // Sami health
  drawBar(8,8,150,12,player.hp/player.maxHp,'#e5404a','#400','SAMI');
  // meter
  const m=player.meter/PLAYER.meterMax;
  px(8,24,150,6,'#222'); px(8,24,150*m, 6, m>=1?'#ff5':'#7cf');
  if(m>=1){ ctx.fillStyle='#ff5'; ctx.font='bold 8px monospace'; ctx.fillText('SUPER READY (U / SUPER)',8,38); }
  // boss health bars (top right)
  const bosses=enemies.filter(e=>e.stats.tier==='boss');
  bosses.forEach((b,i)=>{
    drawBar(VW-158, 8+i*20, 150,12, b.hp/b.maxHp, b.stats.color, '#300', b.stats.name);
  });
  // stage label
  ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText(STAGES[stageIdx].title, VW-8, VH-8); ctx.textAlign='left';
  // peace counter
  ctx.fillStyle='#5fae54'; ctx.font='8px monospace';
  ctx.fillText('☮ '+peaceProgress, 8, VH-8);
}
function drawBar(x,y,w,h,p,c,bg,label){
  px(x-2,y-2,w+4,h+4,'#0d0a16');
  px(x,y,w,h,bg);
  px(x,y,Math.max(0,w*p),h,c);
  // segment ticks
  for(let i=1;i<5;i++) px(x+w*i/5,y,1,h,'#0d0a16');
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace';
  ctx.fillText(label, x+1, y-3);
}

/* ---- MAP screen ---- */
function drawMapScreen(){
  ctx.fillStyle='#1d2340'; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#f7c948'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText('THE ROAD TO CHICAGO', VW/2, 30);
  // route line
  const y=VH/2; const x0=40, x1=VW-40;
  px(x0,y, x1-x0, 3, '#4d5a80');
  const labels=['Garden','Royal Gorge','Red Rocks','Sand Dunes','Denver','Maroon Bells'];
  for(let i=0;i<6;i++){
    const x=x0+(x1-x0)*i/5;
    const done=i<stageIdx, cur=i===stageIdx;
    px(x-5,y-5,10,10, done?'#5fae54':cur?'#f7c948':'#445');
    ctx.fillStyle=cur?'#f7c948':'#9ab'; ctx.font='7px monospace';
    ctx.fillText(labels[i], x, y+ (i%2?20:-12));
  }
  // little bus icon at current
  const bx=x0+(x1-x0)*stageIdx/5;
  px(bx-8, y-18, 16, 10, '#e5404a'); px(bx-6,y-16,4,4,'#9cf'); px(bx+2,y-16,4,4,'#9cf');
  ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText(STAGES[stageIdx].title, VW/2, VH-50);
  ctx.fillStyle='#e08bb0'; ctx.font='8px monospace';
  ctx.fillText(STAGES[stageIdx].sub, VW/2, VH-36);
  if(mapT%50<30){ ctx.fillStyle='#f7c948'; ctx.fillText('▶ press JUMP / PUNCH', VW/2, VH-16); }
  ctx.textAlign='left';
}

/* ---- TITLE screen (canvas) ---- */
let titleT=0;
function drawTitleScreen(){
  titleT++;
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#2a1a40'); g.addColorStop(1,'#e5404a'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // sun
  px(VW/2-40,40,80,80,'#f7c948');
  // skyline silhouette
  for(let i=0;i<12;i++){ const h=20+((i*53)%60); px(i*42, VH-60-h, 38, h+60, '#1a1228'); }
  // logo
  ctx.textAlign='center';
  ctx.fillStyle='#0d0a16'; ctx.font='bold 44px monospace';
  ctx.fillText('SAMI', VW/2+3, 96+3);
  ctx.fillStyle='#f7c948'; ctx.fillText('SAMI', VW/2, 96);
  ctx.fillStyle='#0d0a16'; ctx.font='bold 40px monospace';
  ctx.fillText('SUPREME', VW/2+3, 138+3);
  ctx.fillStyle='#f4e9d0'; ctx.fillText('SUPREME', VW/2, 138);
  // premise
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText('Escape small-town Colorado. Reach Chicago.', VW/2, 168);
  ctx.fillText('The softball team — and your sisters — have other plans.', VW/2, 182);
  // start prompt
  if(titleT%50<30){ ctx.fillStyle='#f7c948'; ctx.font='bold 14px monospace';
    ctx.fillText(isTouch?'▶ TAP TO START':'▶ PRESS ENTER / TAP', VW/2, 218); }
  // controls legend
  ctx.fillStyle='#cbb'; ctx.font='7px monospace';
  ctx.fillText('Move: WASD/Arrows · J light · K heavy · L special · Space jump · Shift dodge · U super', VW/2, VH-12);
  ctx.textAlign='left';
}
cv.addEventListener('pointerdown', ()=>{ if(state===GS.TITLE) startGame(); });

function drawEndingBg(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#f7c948'); g.addColorStop(1,'#e08bb0'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<14;i++){ const h=30+((i*71)%70); px(i*36, VH-h, 32, h, '#1a1228'); }
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
function loop(){
  pauseBtnEl.style.display = (state===GS.COMBAT) ? 'flex' : 'none';
  if(paused){ requestAnimationFrame(loop); return; }
  if(state===GS.COMBAT) updateCombat();
  else if(state===GS.MAP) updateMap();
  else clearEdges();
  render();
  requestAnimationFrame(loop);
}
showTitle();
loop();  // boot
</script>
</body>
